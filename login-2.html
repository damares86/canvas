<html dir="ltr" lang="en-US">

	<meta http-equiv="content-type" content="text/html; charset=utf-8">

	<meta name="author" content="SemiColonWeb">
	<meta name="description" content="Sign in to your Canvas account securely using your username and password, or log in quickly via Facebook or Twitter for convenient social authentication access.">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

	<!-- Core Style -->
	<link rel="stylesheet" href="style.css">

	<!-- Font Icons -->
	<link rel="stylesheet" href="css/font-icons.css">

	<!-- Custom CSS -->
	<link rel="stylesheet" href="css/custom.css">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Document Title
	============================================= -->
	<title>Account Login | Canvas</title>

	<meta name="robots" content="index, follow">
	<meta name="theme-color" content="#1abc9c">
	<link rel="canonical" href="login-2.html">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Canvas">
	<meta property="og:locale" content="en_US">
	<meta property="og:url" content="login-2.html">
	<meta property="og:title" content="Account Login | Canvas">
	<meta property="og:description" content="Sign in to your Canvas account securely using your username and password, or log in quickly via Facebook or Twitter for convenient social authentication access.">
	<meta property="og:image" content="images/parallax/home/1.jpg">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Account Login | Canvas">
	<meta name="twitter:description" content="Sign in to your Canvas account securely using your username and password, or log in quickly via Facebook or Twitter for convenient social authentication access.">
	<meta name="twitter:image" content="images/parallax/home/1.jpg">
	<script type="application/ld+json">
	{
	  "@context": "https://schema.org",
	  "@graph": [
	    {
	      "@type": "WebPage",
	      "name": "Account Login | Canvas",
	      "url": "login-2.html",
	      "description": "Sign in to your Canvas account with your username and password, or log in quickly using Facebook or Twitter.",
	      "image": "images/parallax/home/1.jpg"
	    },
	    {
	      "@type": "Organization",
	      "name": "Canvas",
	      "url": "index.html",
	      "logo": "images/logo-dark.png"
	    }
	  ]
	}
	</script>
</head>

<body class="stretched">

	<!-- Document Wrapper
	============================================= -->
	<div id="wrapper">

		<!-- Content
		============================================= -->
		<section id="content">
			<div class="content-wrap py-0">

				<div class="section p-0 m-0 h-100 position-absolute" style="background: url('images/parallax/home/1.jpg') center center no-repeat; background-size: cover;"></div>

				<div class="section bg-transparent min-vh-100 p-0 m-0">
					<div class="vertical-middle">
						<div class="container-fluid py-5 mx-auto">
							<div class="text-center">
								<a href="index.html"><img src="images/logo-dark.png" alt="Canvas Logo"></a>
							</div>

							<div class="card mx-auto rounded-0 border-0" style="max-width: 400px; background-color: rgba(255,255,255,0.93);">
								<div class="card-body" style="padding: 40px;">
									<form id="login-form" name="login-form" class="mb-0" action="#" method="post">
										<h3>Login to your Account</h3>

										<div class="row">
											<div class="col-12 form-group">
												<label for="login-form-username">Username:</label>
												<input type="text" id="login-form-username" name="login-form-username" value="" class="form-control not-dark">
											</div>

											<div class="col-12 form-group">
												<label for="login-form-password">Password:</label>
												<input type="password" id="login-form-password" name="login-form-password" value="" class="form-control not-dark">
											</div>

											<div class="col-12 form-group">
												<div class="d-flex justify-content-between">
													<button class="button button-3d button-black m-0" id="login-form-submit" name="login-form-submit" value="login">Login</button>
													<a href="#">Forgot Password?</a>
												</div>
											</div>
										</div>
									</form>

									<div class="line line-sm"></div>

									<div class="w-100 text-center">
										<h4 class="mb-3">or Login with:</h4>
										<a href="#" class="button button-rounded bg-facebook">Facebook</a>
										<span class="d-none d-md-inline-block">or</span>
										<a href="#" class="button button-rounded bg-x-twitter">Twitter</a>
									</div>
								</div>
							</div>

							<div class="text-center dark mt-3"><small>Copyrights &copy; All Rights Reserved by Canvas Inc.</small></div>
						</div>
					</div>
				</div>

			</div>
		</section><!-- #content end -->

	</div><!-- #wrapper end -->

	<!-- Go To Top
	============================================= -->
	<div id="gotoTop" class="uil uil-angle-up"></div>

	<!-- JavaScripts
	============================================= -->
	<script src="js/plugins.min.js"></script>
	<script src="js/functions.bundle.js"></script>

</body>
</html>
